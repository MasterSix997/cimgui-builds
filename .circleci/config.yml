version: 2.1
executors:
  windows:
    machine:
      image: "windows-server-2019-vs2019"
  linux:
    docker:
      - image: circleci/python:3.8
  macos:
    macos:
      xcode: "13.0.0"

jobs:
  build-cimgui:
    parameters:
      os:
        type: enum
        enum: [windows, linux, macos]
    executor: << parameters.os >>
    steps:
      - checkout
      - run:
          name: Clone cimgui repository
          command: git clone --recursive https://github.com/cimgui/cimgui.git
      - run:
          name: Checkout specific version
          command: |
            cd cimgui
            if [ "${CIRCLE_BRANCH}" != "master" ]; then
              git checkout ${CIRCLE_BRANCH}
            fi
      - when:
          condition: << parameters.os >> == "linux"
          steps:
            - run:
                name: Install dependencies (Linux)
                command: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential cmake libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - when:
          condition: << parameters.os >> == "windows"
          steps:
            - run:
                name: Setup CMake (Windows)
                command: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --yes
      - run:
          name: Configure CMake
          command: |
            cd cimgui
            cmake -S . -B build
      - run:
          name: Build
          command: |
            cd cimgui
            cmake --build build --config Release
      - store_artifacts:
          path: cimgui/build

workflows:
  version: 2
  build_and_package:
    jobs:
      - build-cimgui:
          name: Build Windows
          os: windows
      - build-cimgui:
          name: Build Linux
          os: linux
      - build-cimgui:
          name: Build macOS
          os: macos